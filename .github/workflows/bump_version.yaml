name: Bump Current Version

# Automatically bump the pyproject.toml and corresponding uv.lock file's minor
# version when a PR is created for src changes.
on:
  workflow_dispatch:

  pull_request:
    types: [ opened ]
    paths: [ src/** ]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump_version:
    name: Bump pyproject.toml Version

    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    env:
      BRANCH: ${{ github.head_ref || github.ref }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba

      - name: Configure Git
        run: |
          git config core.autocrlf input
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        # If no tags exist use the existing version - otherwise bump minor
      - name: Bump Version
        id: bump
        run: |
          echo "Existing Tags..."
          git tag --list

          version="v$(uv version --short)"
          echo "Current version: $version"

          bumped=false
          if [[ -n $(git tag --list $version) ]]; then
            uv version --bump minor
            git add --verbose .
            bumped=true
          else
            echo "Skipping: $version not in tags."
          fi

          echo "bumped=$bumped" >> $GITHUB_OUTPUT

      - name: Commit
        if: steps.bump.outputs.bumped
        run: |
          git commit -m "Workflow Bot 🤖: Version Bump"

      - name: Push
        if: steps.bump.outputs.bumped
        uses: ad-m/github-push-action@d91a481090679876dfc4178fef17f286781251df
        with:
          repository: ${{ github.repository }}
          branch: ${{ env.BRANCH }}
