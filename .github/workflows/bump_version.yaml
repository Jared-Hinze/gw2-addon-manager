name: Bump Current Version

# Automatically bump the pyproject.toml and corresponding uv.lock file's minor
# version when a PR is created for src changes.
on:
  workflow_dispatch:

  pull_request:
    types: [ opened ]
    paths: [ src/** ]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump_version:
    name: Bump pyproject.toml Version

    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba

      - name: Configure Git
        run: |
          git config core.autocrlf input

        # If no tags exist use the existing version - otherwise bump minor
      - name: Bump Version
        run: |
          echo "Existing Tags..."
          git tag --list

          version="v$(uv version --short)"
          echo "Current version: $version"
          if [[ -n $(git tag --list $version) ]]; then
            echo "Bumping..."
            uv version --bump minor
          else
            echo "Skipping: $version not in tags."
          fi

          git add .

      - name: Sign Commit
        uses: qoomon/actions--create-commit@dfef4d264de752be6d6195a4d61a2f3d3262d406
        id: commit
        with:
          message: "Workflow Bot 🤖: Version Bump"
          skip-empty: true

      - name: Push Commit
        if: ${{ steps.commit.outputs.commit }}
        run: git push
